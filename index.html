<title>Carlo & Bi Hatıra Kontrol</title>
<style>
/* Carlo & Bi Hatıra Kontrol — stil */
:root{
  --zemin:#eceff1; --yuzey:#ffffff; --yuzey2:#f4f6f7; --cizgi:#d5dbe0;
  --murekkep:#16202b; --soluk:#5b6875;
  --tamam:#1f9d62; --tamam-zemin:#e3f5ec;
  --eksik:#cf3429; --eksik-zemin:#fdeceb;
  --bekle:#8a5a00; --bekle-zemin:#fff1cc;
  --carlo:#f4b41a; --hatira:#2f7f84;
  --ana:#16202b; --ana-yazi:#ffffff;
  --baslik:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --govde:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --zemin:#0f161d; --yuzey:#18222c; --yuzey2:#1f2b37; --cizgi:#2e3c4a;
    --murekkep:#eef2f5; --soluk:#9aa7b4;
    --tamam:#3fc487; --tamam-zemin:#123526;
    --eksik:#ff7468; --eksik-zemin:#3d1a17;
    --bekle:#ffd166; --bekle-zemin:#3a2f10;
    --ana:#eef2f5; --ana-yazi:#16202b;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--zemin);color:var(--murekkep);font-family:var(--govde);font-size:16px;line-height:1.45}
h1,h2,h3{font-family:var(--baslik);font-weight:700;line-height:1.1;margin:0;letter-spacing:.01em}
h1{font-size:26px} h2{font-size:24px} h3{font-size:19px;font-weight:600}
p{margin:0}
.boot{padding:40px 20px;color:var(--soluk)}
.soluk{color:var(--soluk);font-size:14px}

/* Üst bar */
.ust{position:sticky;top:0;z-index:5;background:#16202b;color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:10px}
.ust .kim{flex:1;min-width:0}
.ust .kim b{display:block;font-family:var(--baslik);font-size:21px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ust .kim span{font-size:13px;color:#b8c3cd}
.ust button{background:#263444;color:#fff;border:0;border-radius:8px;padding:9px 12px;font:inherit;font-size:14px;font-weight:500}
main{max-width:720px;margin:0 auto;padding:16px 14px calc(96px + env(safe-area-inset-bottom,0px))}
main.formda{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}

/* Alt sekmeler */
.sekmeler{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--yuzey);border-top:1px solid var(--cizgi);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.sekmeler button{flex:1;background:none;border:0;border-top:3px solid transparent;padding:11px 4px 12px;font:inherit;font-size:14px;font-weight:500;color:var(--soluk);position:relative}
.sekmeler button.acik{color:var(--murekkep);border-top-color:var(--murekkep);font-weight:600}
.rozet{display:inline-block;min-width:20px;padding:1px 6px;margin-left:4px;border-radius:10px;background:var(--eksik);color:#fff;font-size:12px;font-weight:600;line-height:18px;text-align:center}

/* Kutular */
.kutu{background:var(--yuzey);border:1px solid var(--cizgi);border-radius:12px;padding:16px;margin-bottom:12px}
.bolum-basligi{display:flex;align-items:center;gap:8px;margin:20px 2px 10px}
.bolum-basligi:first-child{margin-top:4px}
.nokta{width:12px;height:12px;border-radius:3px;flex:none}
.carlo .nokta,.nokta.carlo{background:var(--carlo)} .hatira .nokta,.nokta.hatira{background:var(--hatira)}

/* Günün özeti */
.ozet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.ozet button{background:var(--yuzey);border:1px solid var(--cizgi);border-radius:12px;padding:12px 10px;text-align:left;font:inherit;color:inherit}
.ozet b{display:block;font-family:var(--baslik);font-size:30px;line-height:1}
.ozet span{font-size:13px;color:var(--soluk)}

/* Liste satırı */
.satir{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--yuzey);border:1px solid var(--cizgi);border-left:5px solid var(--cizgi);border-radius:10px;padding:14px;margin-bottom:8px;font:inherit;color:inherit}
.satir.carlo{border-left-color:var(--carlo)} .satir.hatira{border-left-color:var(--hatira)}
.satir .ad{flex:1;min-width:0}
.satir .ad b{display:block;font-weight:600}
.satir .ad span{font-size:14px;color:var(--soluk)}
.etiket{display:inline-block;padding:3px 9px;border-radius:6px;font-size:13px;font-weight:600;white-space:nowrap;background:var(--yuzey2);color:var(--soluk)}
.etiket.tamam{background:var(--tamam-zemin);color:var(--tamam)}
.etiket.eksik{background:var(--eksik-zemin);color:var(--eksik)}
.etiket.bekle{background:var(--bekle-zemin);color:var(--bekle)}

/* Düğmeler */
.dugme{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;background:var(--ana);color:var(--ana-yazi);padding:13px 18px;font:inherit;font-weight:600;min-height:48px;cursor:pointer}
.dugme.ikincil{background:var(--yuzey2);color:var(--murekkep);border:1px solid var(--cizgi)}
.dugme.kirmizi{background:var(--eksik);color:#fff}
.dugme.yesil{background:var(--tamam);color:#fff}
.dugme.kucuk{padding:8px 12px;min-height:40px;font-size:14px}
.dugme.tam{width:100%}
.dugme:disabled{opacity:.45}
.dugmeler{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.dugmeler .dugme{flex:1}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #4c9ffe;outline-offset:2px}

/* Form alanları */
label{display:block;font-size:14px;font-weight:600;margin:12px 0 5px}
input,select,textarea{width:100%;border:1px solid var(--cizgi);border-radius:9px;padding:12px;font:inherit;background:var(--yuzey);color:var(--murekkep)}
textarea{min-height:76px;resize:vertical}

/* Filtre çipleri */
.cipler{display:flex;gap:6px;overflow-x:auto;margin:0 -14px 12px;padding:2px 14px}
.cipler button{flex:none;border:1px solid var(--cizgi);background:var(--yuzey);color:var(--murekkep);border-radius:20px;padding:8px 14px;font:inherit;font-size:14px;font-weight:500}
.cipler button.acik{background:var(--ana);color:var(--ana-yazi);border-color:var(--ana)}

/* Checklist doldurma */
.adimlar{display:flex;gap:4px;margin:12px 0 4px}
.adimlar button{flex:1;height:12px;border:0;border-radius:3px;background:var(--cizgi);padding:0}
.adimlar button.bitti{background:var(--tamam)}
.adimlar button.eksikli{background:var(--eksik)}
.adimlar button.simdi{box-shadow:0 0 0 2px var(--yuzey),0 0 0 4px var(--murekkep)}
.adimlar button:disabled{opacity:1}
.soru{background:var(--yuzey);border:1px solid var(--cizgi);border-radius:12px;padding:14px;margin-bottom:10px}
.soru.eksik{border-color:var(--eksik);background:var(--eksik-zemin)}
.soru.hata{border-color:var(--eksik);box-shadow:0 0 0 2px var(--eksik)}
.soru-metin{display:flex;gap:10px;margin-bottom:12px;font-weight:500}
.soru-no{font-family:var(--baslik);font-size:20px;font-weight:700;color:var(--soluk);min-width:22px;line-height:1.15}
.sec{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sec button{min-height:52px;border-radius:10px;border:2px solid var(--cizgi);background:var(--yuzey);color:var(--murekkep);font:inherit;font-size:17px;font-weight:600}
.sec button.t.acik{background:var(--tamam);border-color:var(--tamam);color:#fff}
.sec button.e.acik{background:var(--eksik);border-color:var(--eksik);color:#fff}
.alanlar{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.alanlar label{margin:0 0 4px;font-size:13px;color:var(--soluk)}
.alt-bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--yuzey);border-top:1px solid var(--cizgi);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.alt-bar>div{max-width:720px;margin:0 auto;display:flex;gap:8px}
.alt-bar .dugme{flex:1}
.alt-bar .dugme.ikincil{flex:0 0 96px}

/* Kayıt ve iş kartları */
.is{background:var(--yuzey);border:1px solid var(--cizgi);border-left:5px solid var(--cizgi);border-radius:10px;padding:14px;margin-bottom:10px}
.is.carlo{border-left-color:var(--carlo)} .is.hatira{border-left-color:var(--hatira)}
.is.olmadi{border-color:var(--eksik);background:var(--eksik-zemin)}
.is h3{margin-bottom:4px}
.is .not{margin:8px 0;padding:9px 11px;background:var(--yuzey2);border-radius:8px;font-size:15px}
.is.olmadi .not{background:var(--yuzey)}
.ust-satir{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.madde{padding:10px 0;border-top:1px solid var(--cizgi)}
.madde:first-of-type{border-top:0}
details{margin-top:12px}
summary{font-weight:600;padding:8px 0;cursor:pointer}
.bos{text-align:center;color:var(--soluk);padding:34px 16px}

/* Alt pencere (onay) */
#sheet{position:fixed;inset:0;z-index:20;background:rgba(10,16,22,.55);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
#sheet .pencere{background:var(--yuzey);width:100%;max-width:720px;border-radius:16px 16px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom,0px))}
#sheet h2{margin-bottom:8px}

/* Bildirim */
#toast{position:fixed;left:14px;right:14px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;max-width:692px;margin:0 auto;background:#16202b;color:#fff;border-radius:10px;padding:13px 16px;font-weight:500;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .18s,transform .18s;white-space:pre-line}
#toast.acik{opacity:1;transform:none}
#toast.hata{background:var(--eksik);color:#fff}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* Giriş */
.giris{max-width:420px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top,0px)) 18px 40px}
.giris h1{font-size:40px;margin-bottom:4px}
.giris .kutu{margin-top:22px}
.giris .dugme{margin-top:16px}
.baglanti{background:none;border:0;color:var(--murekkep);font:inherit;font-weight:600;text-decoration:underline;padding:14px 0;width:100%}

/* Düzenleme ve ana ekran kartı */
textarea.uzun{min-height:190px}
.uyari{border-color:var(--bekle);background:var(--bekle-zemin)}
.uyari p{margin-top:6px;font-size:15px}
.adim-listesi{margin:0;padding-left:20px}
.adim-listesi li{margin:4px 0}

      if (o.note) { const v = $('sheet-note').value.trim(); if (!v) { $('sheet-note').focus(); return toast('Açıklama yazmadan gönderilemez.', true); } return done(v); }
      done(true);
    };

/* ---------- Supabase ---------- */
let refreshing = null;
function saveSession() { try { if (S.session) localStorage.setItem(SESSION_KEY, JSON.stringify({ session: S.session, refresh: S.refresh })); else localStorage.removeItem(SESSION_KEY); } catch (e) { /* depolama kapalı olabilir */ } }
function clearSession() { S.session = null; S.refresh = null; S.user = null; S.pending = null; S.records = []; S.tasks = []; S.staff = null; saveSession(); }

async function refreshSession() {
  if (!S.refresh) return false;
  if (!refreshing) {
    refreshing = (async () => {
      try {
        const a = await api('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: JSON.stringify({ refresh_token: S.refresh }) }, false);
        S.session = a.access_token; S.refresh = a.refresh_token; saveSession(); return true;
      } catch (e) { return false; } finally { refreshing = null; }
    })();
  }
  return refreshing;
}

async function api(path, opts = {}, auth = true, retried = false) {
  const headers = { apikey: SUPABASE_KEY, 'Content-Type': 'application/json', ...(auth && S.session ? { Authorization: 'Bearer ' + S.session } : {}), ...(opts.headers || {}) };
  let res;
  try { res = await fetch(SUPABASE_URL + path, { ...opts, headers }); }
  catch (e) { throw Error('Sunucuya ulaşılamadı. İnternet bağlantısını kontrol edin.'); }
  // Oturum süresi dolduysa sessizce yenile ve isteği bir kez tekrarla.
  if (res.status === 401 && auth && !retried && S.refresh && await refreshSession()) return api(path, opts, auth, true);
  const text = await res.text();
  if (!res.ok) {
    let m = text;
    try { const j = JSON.parse(text); m = j.message || j.msg || j.error_description || j.error || text; } catch (e) { /* düz metin */ }
    const err = Error(m || 'Hata ' + res.status); err.status = res.status; throw err;
  }
  return text ? JSON.parse(text) : null;
}

/* ---------- checklist doldurma ---------- */
const draftKey = key => 'kontrol_taslak_' + S.user.id + '_' + key;
const defSig = def => itemCount(def) + ':' + JSON.stringify(def.sections).length;
function readDraft(def) {
  try { const d = JSON.parse(localStorage.getItem(draftKey(def.key)) || 'null'); return d && d.day === todayISO() && d.sig === defSig(def) ? d : null; } catch (e) { return null; }
}
function saveDraft() {
  const f = S.form; if (!f) return;
  try { localStorage.setItem(draftKey(f.def.key), JSON.stringify({ day: todayISO(), sig: defSig(f.def), answers: f.answers, stock: f.stock, waste: f.waste, step: f.step, max: f.max })); } catch (e) { /* yok say */ }
}
function dropDraft(key) { try { localStorage.removeItem(draftKey(key)); } catch (e) { /* yok say */ } }

function startForm(key, fresh) {
  const def = S.defs.find(d => d.key === key); if (!def) return;
  const draft = fresh ? null : readDraft(def);
  const f = { def, answers: {}, stock: '', waste: '', step: 0, max: 0, errors: {} };
  if (draft) { Object.assign(f, { answers: draft.answers || {}, stock: draft.stock || '', waste: draft.waste || '', step: draft.step || 0, max: draft.max || 0 }); }
  // Tarih alanları bugünün tarihiyle hazır gelir.
  def.sections.forEach((s, i) => s.items.forEach((it, j) => {
    const item = itemOf(it); if (!item.fields) return;
    const k = i + '-' + j, a = f.answers[k] || (f.answers[k] = {}); a.fields = a.fields || {};
    item.fields.forEach(fd => { if (a.fields[fd.key] == null || a.fields[fd.key] === '') { if (fd.type === 'date') a.fields[fd.key] = todayISO(); else if (fd.type === 'select') a.fields[fd.key] = fd.options[0]; } });
  }));
  const last = def.sections.length + (def.stock ? 1 : 0);
  f.step = Math.min(f.step, last); f.max = Math.min(Math.max(f.max, f.step), last);
  S.form = f; S.view = 'form'; render(); window.scrollTo(0, 0);
  if (draft) toast('Bugünkü taslağın açıldı. Kaldığın yerden devam edebilirsin.');
}
const stepCount = f => f.def.sections.length + (f.def.stock ? 1 : 0) + 1; // bölümler + (stok) + özet
const fieldsFilled = (item, a) => item.fields.every(fd => String(a?.fields?.[fd.key] ?? '').trim() !== '');

// Bölümü doğrular: boş normal maddeler Tamam olur; sayı/tarih isteyen maddeler doldurulmalı ya da Eksik işaretlenmeli.
function settleSection(i) {
  const f = S.form, sec = f.def.sections[i]; let ok = true;
  sec.items.forEach((it, j) => {
    const item = itemOf(it), k = i + '-' + j, a = f.answers[k] || (f.answers[k] = {});
    delete f.errors[k];
    if (item.fields) {
      if (a.value === 'Eksik') return;
      if (fieldsFilled(item, a)) a.value = 'Tamam'; else { f.errors[k] = true; ok = false; }
    } else if (!a.value) a.value = 'Tamam';
  });
  return ok;
}
function fieldSummary(item, a) {
  if (!item.fields) return '';
  return item.fields.filter(fd => fd.type !== 'select').map(fd => {
    const v = String(a?.fields?.[fd.key] ?? '').trim(); if (!v) return '';
    if (fd.type === 'date') return fd.label + ': ' + trDate(v);
    const unit = fd.unitKey ? (a.fields[fd.unitKey] || '') : (fd.unit || '');
    return fd.label + ': ' + v + (unit ? ' ' + unit : '');
  }).filter(Boolean).join(', ');
}

function setAnswer(k, v) {
  const f = S.form, a = f.answers[k] || (f.answers[k] = {});
  a.value = v; delete f.errors[k]; saveDraft(); redrawItem(k); redrawProgress();
  if (v === 'Eksik') { const t = document.querySelector(`[data-item="${k}"] textarea`); if (t) t.focus(); }
}
function formNext() {
  const f = S.form, n = f.def.sections.length;
  if (f.step < n) {
    if (!settleSection(f.step)) { saveDraft(); render(); return toast('Miktar ve tarih alanlarını doldurun ya da maddeyi Eksik işaretleyin.', true); }
  } else if (f.def.stock && f.step === n) {
    if (!f.stock.trim() || !f.waste.trim()) return toast('Stok ve zayi alanlarına bilgi ya da “Yok” yazın.', true);
  }
  f.step++; f.max = Math.max(f.max, f.step); saveDraft(); render(); window.scrollTo(0, 0);
}
function formBack() { const f = S.form; if (f.step === 0) return leaveForm(); f.step--; render(); window.scrollTo(0, 0); }
function formGo(i) { const f = S.form; if (i > f.max) return; f.step = i; render(); window.scrollTo(0, 0); }
function approveSection() {
  const f = S.form, i = f.step;
  f.def.sections[i].items.forEach((it, j) => { const item = itemOf(it), k = i + '-' + j, a = f.answers[k] || (f.answers[k] = {}); if (!a.value && (!item.fields || fieldsFilled(item, a))) a.value = 'Tamam'; });
  saveDraft(); render();
}
function leaveForm() { saveDraft(); S.form = null; S.view = 'tabs'; S.tab = 'lists'; render(); }

async function submitForm() {
  const f = S.form, def = f.def;
  for (let i = 0; i < def.sections.length; i++) if (!settleSection(i)) { f.step = i; render(); return toast('Bu bölümde doldurulmamış alan var.', true); }
  if (def.stock && (!f.stock.trim() || !f.waste.trim())) { f.step = def.sections.length; render(); return toast('Stok ve zayi alanlarına bilgi ya da “Yok” yazın.', true); }
  const answers = {}, labels = {};
  def.sections.forEach((s, i) => s.items.forEach((it, j) => {
    const item = itemOf(it), k = i + '-' + j, a = f.answers[k], out = { value: a.value };
    const note = (a.note || '').trim(); if (note) out.note = note;
    if (item.fields && a.value !== 'Eksik') { out.fields = a.fields; const d = fieldSummary(item, a); if (d) out.detail = d; }
    answers[k] = out; labels[k] = item.label;
  }));
  const rec = { business: def.business, type: def.key, title: def.title, answers, labels, stock: f.stock.trim(), waste: f.waste.trim(), person: S.user.name, person_id: S.user.id, status: 'Onay bekliyor' };
  const btn = document.querySelector('[data-a="submit"]'); if (btn) { btn.disabled = true; btn.textContent = 'Gönderiliyor…'; }
  try {
    await api('/rest/v1/checklist_records', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify(rec) });
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Kontrolü gönder'; }
    return toast('Kayıt gönderilemedi: ' + e.message + '\nYazdıkların silinmedi, tekrar deneyebilirsin.', true);
  }
  dropDraft(def.key); S.form = null; S.view = 'tabs'; S.tab = 'records';
  try { await loadData(); } catch (e) { /* liste sonra yenilenir */ }
  render();
  let mail = 'E-posta bildirimi gönderildi.';
  try {
    const saved = S.records.find(x => x.person_id === rec.person_id && x.title === rec.title);
    const result = await api('/functions/v1/send-checklist-email', { method: 'POST', body: JSON.stringify({
      personnel_name: rec.person, business_name: rec.business, checklist_name: rec.title,
      submitted_at: new Date().toLocaleString('tr-TR', { timeZone: 'Europe/Istanbul' }),
      answers: Object.entries(answers).map(([k, v]) => ({ madde: labels[k] || k, durum: v.value, aciklama: [v.detail, v.note].filter(Boolean).join(' — ') })),
      record_id: saved ? saved.id : null,
    }) });
    if (!result || !result.id) throw Error('e-posta işlem numarası dönmedi');
  } catch (e) { mail = 'E-posta bildirimi gönderilemedi (' + e.message + '). Kayıt veritabanında duruyor.'; }
  toast('Kontrol kaydedildi, müdür onayı bekliyor.\n' + mail);
}

function installCard() {
  const standalone = navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  let hidden = false; try { hidden = localStorage.getItem('kontrol_anaekran') === '1'; } catch (e) { /* yok say */ }
  if (standalone || hidden) return '';
  const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const steps = ios

function taskCard(t) {
  const rejected = t.status === 'rejected';
  const label = { open: ['Eksik', 'eksik'], rejected: ['Olmadı, tekrar yapılacak', 'eksik'], pending_approval: ['Müdür onayı bekliyor', 'bekle'], approved: ['Onaylandı', 'tamam'] }[t.status] || [t.status, ''];
  let b = '';
  if (isStaff() && ['open', 'rejected'].includes(t.status)) b += `<button class="dugme yesil" data-a="task-done" data-id="${esc(t.id)}">Tamamladım</button>`;
  if (isManager() && t.status === 'pending_approval') b += `<button class="dugme yesil" data-a="task-ok" data-id="${esc(t.id)}">Onayla</button><button class="dugme kirmizi" data-a="task-no" data-id="${esc(t.id)}">Tekrar yap</button>`;
  return `<div class="is ${bizClass(t.business)} ${rejected ? 'olmadi' : ''}"><div class="ust-satir"><h3>${esc(t.item_label)}</h3><span class="etiket ${label[1]}">${esc(label[0])}</span></div><p class="soluk">${esc(t.business || '')}${t.checklist_title ? ', ' + esc(t.checklist_title) : ''}${t.reporter_name ? '. Bildiren: ' + esc(t.reporter_name) : ''}</p>${t.initial_note ? `<p class="not">${esc(t.initial_note)}</p>` : ''}${t.manager_note ? `<p class="not"><b>Müdür notu:</b> ${esc(t.manager_note)}</p>` : ''}${t.completed_at ? `<p class="soluk">Tamamlayan: ${esc(t.completed_by_name || '')}, ${fmt(t.completed_at)}</p>` : ''}${t.approved_at ? `<p class="soluk">Onaylayan: ${esc(t.approved_by_name || '')}, ${fmt(t.approved_at)}</p>` : ''}${t.reviewed_at && !t.approved_at ? `<p class="soluk">Son müdür kontrolü: ${fmt(t.reviewed_at)}</p>` : ''}${b ? `<div class="dugmeler">${b}</div>` : ''}</div>`;
}
function viewTasks() {
  if (S.tasksError) return `<div class="kutu"><p>Eksik işler yüklenemedi: ${esc(S.tasksError)}</p><div class="dugmeler"><button class="dugme" data-a="refresh">Tekrar dene</button></div></div>`;

    (hidden ? `<button class="dugme ikincil tam" data-a="toggle-old">${S.showOld ? '48 saatten eski onaylıları gizle' : `48 saatten eski ${hidden} onaylı kaydı göster`}</button>` : '');
}
function viewDetail() {
  const r = S.records.find(x => x.id === S.detailId); if (!r) { S.view = 'tabs'; return viewRecords(); }
  const entries = Object.entries(r.answers), missing = entries.filter(([, v]) => v.value === 'Eksik'), measured = entries.filter(([, v]) => v.detail && v.value !== 'Eksik');
  const line = ([k, v]) => `<div class="madde"><b>${esc(r.labels[k] || k)}</b>${v.detail ? `<p class="soluk">${esc(v.detail)}</p>` : ''}${v.note ? `<p>${esc(v.note)}</p>` : ''}</div>`;
  return `<button class="dugme ikincil kucuk" data-a="back">‹ Geri</button><div class="kutu ${bizClass(r.business)}" style="margin-top:12px"><div class="ust-satir"><h2>${esc(r.title)}</h2>${statusTag(r.status)}</div><p class="soluk">${esc(r.person)}, ${esc(r.business)}, ${fmt(r.time)}</p>${r.approver ? `<p class="soluk">Kontrol eden: ${esc(r.approver)}${r.approved_at ? ', ' + fmt(r.approved_at) : ''}</p>` : ''}<p style="margin-top:8px"><b>${entries.length - missing.length} tamam</b>, <b style="${missing.length ? 'color:var(--eksik)' : ''}">${missing.length} eksik</b></p>${canApproveRecord(r) ? `<div class="dugmeler"><button class="dugme yesil" data-a="rec-ok" data-id="${esc(r.id)}">Onayla</button><button class="dugme kirmizi" data-a="rec-no" data-id="${esc(r.id)}">Tekrar yap</button></div>` : ''}</div>` +
    `<div class="kutu"><h3>Eksikler</h3>${missing.length ? missing.map(line).join('') : '<p class="soluk" style="margin-top:6px">Eksik bildirilmedi.</p>'}</div>` +
    (measured.length ? `<div class="kutu"><h3>Hazırlık kayıtları</h3>${measured.map(line).join('')}</div>` : '') +
    (r.stock || r.waste ? `<div class="kutu"><h3>Stok ve zayi</h3><p style="margin-top:6px"><b>Stok:</b> ${esc(r.stock || 'Belirtilmedi')}</p><p><b>Zayi:</b> ${esc(r.waste || 'Belirtilmedi')}</p></div>` : '') +
    `<div class="kutu"><details><summary>Tüm maddeler (${entries.length})</summary>${entries.map(([k, v]) => `<div class="madde"><span class="etiket ${v.value === 'Eksik' ? 'eksik' : 'tamam'}">${esc(v.value)}</span> ${esc(r.labels[k] || k)}</div>`).join('')}</details><div class="dugmeler"><button class="dugme ikincil" data-a="copy" data-id="${esc(r.id)}">Raporu kopyala</button></div></div>`;
}

/* --- form görünümü --- */
function itemHtml(i, j) {
  const f = S.form, item = itemOf(f.def.sections[i].items[j]), k = i + '-' + j, a = f.answers[k] || {};
  const fields = item.fields ? `<div class="alanlar">${item.fields.map(fd => {
    const id = 'f-' + k + '-' + fd.key, v = a.fields?.[fd.key] ?? '', common = `id="${id}" data-i="field" data-k="${k}" data-f="${esc(fd.key)}"`;
    const input = fd.type === 'select' ? `<select ${common}>${fd.options.map(o => `<option${o === v ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`
      : fd.type === 'date' ? `<input ${common} type="date" value="${esc(v)}">`
      : `<input ${common} type="number" inputmode="decimal" min="0" step="any" value="${esc(v)}" placeholder="0">`;
    return `<div><label for="${id}">${esc(fd.label)}${fd.unit ? ' (' + esc(fd.unit) + ')' : ''}</label>${input}</div>`;
  }).join('')}</div>` : '';
  const labels = item.fields ? ['Hazırlandı', 'Hazırlanamadı'] : ['Tamam', 'Eksik'];
  return `<div class="soru ${a.value === 'Eksik' ? 'eksik' : ''} ${f.errors[k] ? 'hata' : ''}" data-item="${k}"><p class="soru-metin"><span class="soru-no">${j + 1}</span><span>${esc(item.label)}</span></p>${fields}<div class="sec"><button class="t ${a.value === 'Tamam' ? 'acik' : ''}" data-a="ans" data-k="${k}" data-v="Tamam" aria-pressed="${a.value === 'Tamam'}">${labels[0]}</button><button class="e ${a.value === 'Eksik' ? 'acik' : ''}" data-a="ans" data-k="${k}" data-v="Eksik" aria-pressed="${a.value === 'Eksik'}">${labels[1]}</button></div>${a.value === 'Eksik' ? `<label for="n-${k}">Eksiklik açıklaması</label><textarea id="n-${k}" data-i="note" data-k="${k}" placeholder="Ne eksik, neden?">${esc(a.note || '')}</textarea>` : ''}</div>`;
}
function progressHtml() {
  const f = S.form, n = f.def.sections.length, total = itemCount(f.def), done = Object.values(f.answers).filter(a => a.value).length, last = stepCount(f) - 1;
  const where = f.step < n ? `Bölüm ${f.step + 1} / ${n}` : f.def.stock && f.step === n ? 'Stok ve zayi' : 'Gönderim öncesi özet';
  const steps = Array.from({ length: stepCount(f) }, (_, i) => {
    let cls = '';
    if (i < n) { const ans = f.def.sections[i].items.map((_, j) => f.answers[i + '-' + j]?.value); if (ans.includes('Eksik')) cls = 'eksikli'; else if (ans.every(Boolean)) cls = 'bitti'; }
    else if (i < f.max || (i === last && f.step === last)) cls = 'bitti';
    const name = i < n ? f.def.sections[i].title : i === last ? 'Özet' : 'Stok ve zayi';
    return `<button class="${cls} ${i === f.step ? 'simdi' : ''}" data-a="go" data-n="${i}" ${i > f.max ? 'disabled' : ''} aria-label="${esc(name)}"></button>`;
  }).join('');
  return `<div class="ust-satir"><h2>${esc(f.def.title)}</h2><span class="etiket">${done}/${total}</span></div><p class="soluk">${esc(f.def.business)}, ${where}</p><div class="adimlar">${steps}</div>`;
}
function redrawItem(k) { const el = document.querySelector(`[data-item="${k}"]`); if (el) { const [i, j] = k.split('-').map(Number); el.outerHTML = itemHtml(i, j); } }
function redrawProgress() { const el = $('ilerleme'); if (el) el.innerHTML = progressHtml(); }

function viewForm() {
  const f = S.form, def = f.def, n = def.sections.length;
  let body, next = 'İleri';
  if (f.step < n) {
    const sec = def.sections[f.step];
    body = `<div class="ust-satir" style="margin:16px 2px 10px;align-items:center"><h2>${esc(sec.title)}</h2><button class="dugme ikincil kucuk" data-a="approve-section">Tümü tamam</button></div><p class="soluk" style="margin:0 2px 12px">Yalnızca eksikleri işaretlemen yeterli. İleri dediğinde boş kalan maddeler Tamam sayılır.</p>${sec.items.map((_, j) => itemHtml(f.step, j)).join('')}`;
  } else if (def.stock && f.step === n) {
    body = `<div class="kutu" style="margin-top:14px"><h2>Stok ve zayi</h2><label for="stock">Eksik stoklar (ürün, mevcut, eksik miktar)</label><textarea id="stock" data-i="stock" placeholder="Eksik yoksa Yok yazın">${esc(f.stock)}</textarea><label for="waste">Zayi ürünler (ürün, miktar, neden)</label><textarea id="waste" data-i="waste" placeholder="Zayi yoksa Yok yazın">${esc(f.waste)}</textarea></div>`;
    next = 'Özete geç';
  } else {
    const total = itemCount(def), miss = [], meas = [];
    def.sections.forEach((s, i) => s.items.forEach((it, j) => { const item = itemOf(it), a = f.answers[i + '-' + j] || {}; if (a.value === 'Eksik') miss.push([i, item, a]); else if (item.fields) meas.push([i, item, a]); }));
    body = `<div class="kutu" style="margin-top:14px"><h2>Kontrol özeti</h2><p style="margin-top:6px"><b>${total - miss.length} tamam</b>, <b style="${miss.length ? 'color:var(--eksik)' : ''}">${miss.length} eksik</b></p>${miss.length ? miss.map(([i, item, a]) => `<div class="madde"><b>${esc(item.label)}</b><p>${esc(a.note || 'Açıklama yazılmadı')}</p><button class="dugme ikincil kucuk" data-a="go" data-n="${i}" style="margin-top:6px">Düzenle</button></div>`).join('') : '<p class="soluk">Eksik madde yok.</p>'}</div>` +
      (meas.length ? `<div class="kutu"><h3>Hazırlık kayıtları</h3>${meas.map(([, item, a]) => `<div class="madde"><b>${esc(item.label)}</b><p class="soluk">${esc(fieldSummary(item, a))}</p></div>`).join('')}</div>` : '') +
      (def.stock ? `<div class="kutu"><h3>Stok ve zayi</h3><p style="margin-top:6px"><b>Stok:</b> ${esc(f.stock)}</p><p><b>Zayi:</b> ${esc(f.waste)}</p></div>` : '') +
      `<p class="soluk" style="margin:0 2px">Gönderdiğinde kayıt müdür onayına düşer, eksikler Eksik İşler listesine eklenir.</p>`;
    next = null;
  }
  return `<div class="ust"><div class="kim"><b>${esc(S.user.name)}</b><span>Taslak bu telefonda otomatik saklanır</span></div><button data-a="leave">Çık</button></div><main class="formda"><div class="kutu" id="ilerleme" style="margin-bottom:0">${progressHtml()}</div>${body}</main><div class="alt-bar"><div><button class="dugme ikincil" data-a="form-back">Geri</button>${next ? `<button class="dugme" data-a="form-next">${next}</button>` : '<button class="dugme yesil" data-a="submit">Kontrolü gönder</button>'}</div></div>`;
}

function render() {
  const app = $('app');
  if (!S.user) { app.innerHTML = viewAuth(); return; }
  if (S.view === 'form' && S.form) { app.innerHTML = viewForm(); return; }
  const tabs = [['lists', 'Listeler', 0], ['tasks', 'Eksik işler', taskBadge()]];
  if (canReview()) tabs.push(['approvals', 'Onaylar', pendingRecords().length + (S.staff ? S.staff.length : 0)]);
  tabs.push(['records', 'Kayıtlar', 0]);
  if (!tabs.some(t => t[0] === S.tab)) S.tab = 'lists';
  if ((S.view === 'editor' || S.view === 'editor-list') && !isAdmin()) S.view = 'tabs';
  if (S.view === 'editor' && !S.edit) S.view = 'editor-list';
  const body = S.view === 'detail' ? viewDetail() : S.view === 'editor-list' ? viewEditorList() : S.view === 'editor' ? viewEditor() : { lists: viewLists, tasks: viewTasks, approvals: viewApprovals, records: viewRecords }[S.tab]();
  app.innerHTML = `<div class="ust"><div class="kim"><b>${esc(S.user.name)}</b><span>${esc(S.user.business)}, ${esc(roleName(S.user.role))}</span></div><button data-a="refresh">Yenile</button><button data-a="logout">Çıkış</button></div><main>${body}</main><nav class="sekmeler">${tabs.map(([k, v, n]) => `<button class="${S.tab === k ? 'acik' : ''}" data-a="tab" data-t="${k}">${v}${n ? `<span class="rozet">${n}</span>` : ''}</button>`).join('')}</nav>`;
}

/* ---------- olaylar ---------- */
const ACTIONS = {
  login, signup, logout, 'check-approval': checkApproval, refresh: () => refreshAll(false),
  'auth-login': () => { S.authView = 'login'; render(); }, 'auth-signup': () => { S.authView = 'signup'; render(); },
  tab: d => { S.tab = d.t; S.view = 'tabs'; render(); window.scrollTo(0, 0); },
  start: d => startForm(d.k), ans: d => setAnswer(d.k, d.v), go: d => formGo(+d.n),
  'form-next': formNext, 'form-back': formBack, 'approve-section': approveSection, leave: leaveForm, submit: submitForm,
  'task-filter': d => { S.taskFilter = d.v; render(); }, 'task-biz': d => { S.taskBiz = d.v; render(); },
  'task-done': d => completeTask(d.id), 'task-ok': d => reviewTask(d.id, true), 'task-no': d => reviewTask(d.id, false),
  'rec-ok': d => reviewRecord(d.id, 'Onaylandı'), 'rec-no': d => reviewRecord(d.id, 'Düzeltme istendi'),
  'staff-ok': d => approveStaff(d.id), detail: d => { S.detailId = d.id; S.view = 'detail'; render(); window.scrollTo(0, 0); },
  back: () => { S.view = 'tabs'; render(); },
  editor: () => { S.edit = null; S.view = 'editor-list'; render(); window.scrollTo(0, 0); },
  'edit-def': d => editDef(d.k), 'edit-new': () => editDef(null), 'e-save': saveEdit,
  'e-add': () => { S.edit.sections.push({ title: '', locked: false, items: [], text: '' }); render(); const el = $('es-' + (S.edit.sections.length - 1)); if (el) el.focus(); },
  'e-del': d => removeEditSection(+d.n), 'e-up': d => moveEditSection(+d.n, -1), 'e-down': d => moveEditSection(+d.n, 1),
  export: exportExcel,
  'hide-install': () => { try { localStorage.setItem('kontrol_anaekran', '1'); } catch (e) { /* yok say */ } render(); }, copy: d => copyReport(d.id), 'toggle-old': () => { S.showOld = !S.showOld; render(); },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const fn = ACTIONS[b.dataset.a]; if (fn) fn(b.dataset);
});
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset || !el.dataset.i) return;
  const ed = S.edit, kind = el.dataset.i;
  if (ed && kind.startsWith('e-')) {
    const x = ed.sections[+el.dataset.n];
    if (kind === 'e-title') ed.title = el.value; else if (kind === 'e-biz') ed.business = el.value;
    else if (kind === 'e-stock') ed.stock = el.value === '1'; else if (kind === 'e-active') ed.active = el.value === '1';
    else if (kind === 'e-sec-title' && x) x.title = el.value; else if (kind === 'e-sec-items' && x) x.text = el.value;
    return;
  }
  const f = S.form; if (!f) return;
  const k = el.dataset.k;
  if (el.dataset.i === 'note') (f.answers[k] || (f.answers[k] = {})).note = el.value;
  else if (el.dataset.i === 'field') { const a = f.answers[k] || (f.answers[k] = {}); (a.fields || (a.fields = {}))[el.dataset.f] = el.value; }
  else if (el.dataset.i === 'stock') f.stock = el.value;
  else if (el.dataset.i === 'waste') f.waste = el.value;
  saveDraft();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !S.user && e.target.tagName === 'INPUT') { e.preventDefault(); (S.authView === 'signup' ? signup : login)(); }
});
// Uygulamaya geri dönüldüğünde veriler bir dakikadan eskiyse sessizce yenilenir.
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.user && S.view !== 'form' && Date.now() - S.lastLoad > 60000) refreshAll(true); });

// Android'de “Uygulamayı yükle” için manifest; iPhone'da apple-touch-icon yeterlidir.
function setupManifest() {
  try {
    const i192 = $('icon-192'), i512 = $('icon-512'); if (!i192 || !i512 || !window.URL || !URL.createObjectURL) return;
    const base = location.origin + location.pathname;
    const m = { name: 'Carlo & Bi Hatıra Kontrol', short_name: 'Kontrol', start_url: base, scope: base.replace(/[^/]*$/, ''), display: 'standalone', background_color: '#eceff1', theme_color: '#16202b',
      icons: [{ src: i192.href, sizes: '192x192', type: 'image/png', purpose: 'any maskable' }, { src: i512.href, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }] };
    const link = document.createElement('link'); link.rel = 'manifest'; link.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' })); document.head.appendChild(link);
  } catch (e) { /* manifest yoksa uygulama yine çalışır */ }
}
async function init() {
  try {
    const el = $('checklist-data');
    if (el) S.builtin = JSON.parse(el.textContent);
    else { const res = await fetch('checklists.json'); if (!res.ok) throw Error('Checklist listesi yüklenemedi.'); S.builtin = await res.json(); }
    buildDefs(); setupManifest();
    let stored = null; try { stored = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { /* yok say */ }
    if (stored && stored.session) {
      S.session = stored.session; S.refresh = stored.refresh;
      try { await loadProfile(); }
      catch (e) { if (e.status === 401 || e.status === 400 || e.status === 403) clearSession(); else throw e; }
    }
    render();
  } catch (e) {
    $('app').innerHTML = `<div class="giris"><h1>Açılamadı</h1><div class="kutu"><p>${esc(e.message)}</p><button class="dugme tam" onclick="location.reload()">Tekrar dene</button></div></div>`;
  }
}
init();
</script>
</body>
</html>
